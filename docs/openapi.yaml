  /api/v1/admin/sessions:
    get:
      tags: [admin]
      summary: List class sessions
      description: Time filters select sessions overlapping the half-open window `[from,to)`.
      operationId: listAdminClassSessions
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - { $ref: "#/components/parameters/FromTime" }
        - { $ref: "#/components/parameters/ToTime" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/SessionStatus" }
        - name: class_id
          in: query
          schema: { type: string, format: uuid }
        - name: teacher_id
          in: query
          schema: { type: string, format: uuid }
        - name: location_id
          in: query
          schema: { type: string, format: uuid }
        - { name: session_type, in: query, schema: { type: string, enum: [theory, workshop, assessment, other] } }
        - { name: attendance_state, in: query, schema: { type: string, enum: [locked, unlocked] } }
        - { name: sort_by, in: query, schema: { type: string, enum: [starts_at, title, created_at], default: starts_at } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        "200":
          description: Paginated class sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionListResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Create a class session
      description: |
        `starts_at` and `ends_at` accept RFC3339 offsets and are stored/returned
        in UTC. The class date range and fixed training slot are evaluated in
        Asia/Ho_Chi_Minh. The accepted local slots are 08:00–12:00,
        13:30–17:30, and 18:30–21:30.
      operationId: createAdminClassSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionWriteRequest" }
      responses:
        "201":
          description: Class session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/sessions/{sessionID}:
    parameters:
      - { $ref: "#/components/parameters/SessionID" }
    get:
      tags: [admin]
      summary: Get a class session
      operationId: getAdminClassSession
      responses:
        "200":
          description: Class session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      summary: Replace class session fields
      description: Locked sessions cannot be changed.
      operationId: updateAdminClassSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionWriteRequest" }
      responses:
        "200":
          description: Class session updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/sessions/{sessionID}/attendance:
    parameters:
      - { $ref: "#/components/parameters/SessionID" }
    get:
      tags: [admin]
      summary: View a session attendance roster
      description: Includes every actively enrolled student and any recorded status.
      operationId: getAdminSessionAttendance
      responses:
        "200":
          description: Session attendance roster and counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionAttendanceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/sessions/{sessionID}/students/{studentID}/attendance:
    parameters:
      - { $ref: "#/components/parameters/SessionID" }
      - name: studentID
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Unique student profile identifier
    post:
      tags: [admin]
      summary: Record or correct session attendance for a student with mandatory reason
      description: |
        Allows an administrator to record or adjust attendance for any student in a session.
        A non-empty reason is required and preserved in audit and class history logs.
      operationId: correctAdminStudentAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceCorrectionRequest" }
      responses:
        "200":
          description: Created or corrected attendance record
