# ==========================================================================
# NSA Training Platform API — OpenAPI contract (SOURCE OF TRUTH)
# Update this file in the SAME phase as the API change it describes.
# View locally: make swagger  →  http://localhost:8081
# ==========================================================================
openapi: 3.1.0

info:
  title: NSA App API
  version: "1.3.0"
  description: |
    REST/JSON API for the NSA App (modular monolith).
    Base path: `/api/v1`. All timestamps are UTC (RFC 3339).

    **Roles:** ADMIN, TEACHER, STUDENT (RBAC + ownership checks).

    **Response envelopes**
    - Success: `{ "data": ..., "message": "Success" }`
    - Error: `{ "error": { "code": "SOME_CODE", "message": "...", "details": [] } }`

    **Implementation status:** Phase 21 — system probes, authentication/RBAC,
    academic-core administration, training locations, class-session scheduling,
    role-scoped schedules, batch attendance, corrections, locking, and Student
    temporally correct attendance history/summary with absence-risk warnings
    are live. Practical assessments with evidence, deterministic Student progress,
    ADMIN completion decisions, verifiable PDF certificates, in-app notifications,
    operational CSV reports, assignment-scoped Teacher workspaces, validated
    management filters, and focused Admin/Teacher attendance workspaces are live.

    **Authentication:** `POST /api/v1/auth/login` returns a short-lived JWT
    access token (use as `Authorization: Bearer <token>`) and sets an
    HttpOnly `nsa_refresh` cookie (path `/api/v1/auth`) used by
    `/auth/refresh` and `/auth/logout`. Refresh tokens rotate on every use;
    reuse of a revoked token revokes the entire session family.

servers:
  - url: http://localhost:8080
    description: Local development (business endpoints are prefixed /api/v1)

tags:
  - name: system
    description: Operational endpoints (no authentication)
  - name: auth
    description: Authentication and session management (Phase 3)
  - name: admin
    description: Administrator management endpoints (Phase 4+)
  - name: teacher
    description: Teacher schedule and assigned-class endpoints (Phase 5+)
  - name: student
    description: Student schedule and self-service endpoints (Phase 5+)
  - name: sale
    description: Sale CRM, Lead pipeline, interactions, tasks, and orders (Phase 26)

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      description: Returns 200 when the API process is up. Does not check dependencies.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: API is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data: { status: "ok" }
                message: Success

  /ready:
    get:
      tags: [system]
      summary: Readiness probe
      description: Returns 200 only when the API can serve traffic (database reachable); otherwise 503.
      operationId: getReady
      security: []
      responses:
        "200":
          description: API is ready (database reachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data: { status: "ready", database: "up" }
                message: Success
        "503":
          description: API is not ready (database unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Database is not reachable
                  details: []

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      description: Rate-limited (10 req/min per IP). Invalid credentials always return the same generic 401 (no user enumeration).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful. Refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: "nsa_refresh=<opaque>; Path=/api/v1/auth; HttpOnly; SameSite=Lax (Secure outside development)"
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBundleResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Invalid credentials (generic)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error: { code: INVALID_CREDENTIALS, message: "Invalid email or password" }
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/sso:
    post:
      tags: [auth]
      summary: Log in via SSO provider (Google or Microsoft)
      description: Authenticates existing active accounts matching the verified email. Non-existent accounts return 404 ACCOUNT_NOT_FOUND; locked/suspended accounts return 403 ACCOUNT_SUSPENDED.
      operationId: ssoLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSOLoginRequest"
      responses:
        "200":
          description: SSO login successful. Refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: "nsa_refresh=<opaque>; Path=/api/v1/auth; HttpOnly; SameSite=Lax (Secure outside development)"
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBundleResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Account suspended or inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error: { code: ACCOUNT_SUSPENDED, message: "Tài khoản của bạn đã bị tạm khóa hoặc ngừng hoạt động. Vui lòng liên hệ Quản trị viên." }
        "404":
          description: Account not found in system
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error: { code: ACCOUNT_NOT_FOUND, message: "Email này chưa được cấp tài khoản trong hệ thống. Vui lòng liên hệ Quản trị viên để được tạo tài khoản." }
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/oauth/config:
    get:
      tags: [auth]
      summary: Get OAuth client IDs and configuration status
      operationId: getOAuthConfig
      security: []
      responses:
        "200":
          description: OAuth provider configuration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  google_configured: { type: boolean }
                  google_client_id: { type: string }
                  microsoft_configured: { type: boolean }
                  microsoft_client_id: { type: string }

  /api/v1/auth/oauth/callback:
    post:
      tags: [auth]
      summary: Exchange OAuth authorization code for session bundle
      description: Exchanges authorization code with provider to verify email, then enforces pre-created active user policy.
      operationId: oauthCallback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthCallbackRequest"
      responses:
        "200":
          description: OAuth login successful
          headers:
            Set-Cookie:
              description: "nsa_refresh=<opaque>; Path=/api/v1/auth; HttpOnly; SameSite=Lax (Secure outside development)"
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBundleResponse"
        "400":
          description: Validation or code exchange failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Account suspended or inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Account not found in system
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and get a new access token
      description: Reads the `nsa_refresh` HttpOnly cookie. Rotates the token on every call; presenting a revoked token revokes the whole session family.
      operationId: refresh
      security: []
      responses:
        "200":
          description: New token bundle issued
          headers:
            Set-Cookie:
              description: Rotated nsa_refresh cookie
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBundleResponse"
        "401":
          description: Refresh token missing/invalid/expired/revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error: { code: INVALID_REFRESH_TOKEN, message: "Refresh token is invalid or expired" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Log out (revoke the refresh token)
      operationId: logout
      security: []
      responses:
        "200":
          description: Logged out (idempotent); refresh cookie cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Change the current user's password
      description: Requires a valid access token. On success all refresh tokens are revoked (re-login required). New password must be at least 8 characters.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed; all sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: WRONG_CURRENT_PASSWORD or WEAK_PASSWORD
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Get the authenticated user's profile
      operationId: getMe
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                type: object
                required: [data, message]
                properties:
                  data: { $ref: "#/components/schemas/UserInfo" }
                  message: { type: string, example: Success }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/admin/students:
    get:
      tags: [admin]
      summary: List students
      operationId: listAdminStudents
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/StudentStatus" }
        - { name: course_id, in: query, schema: { type: string, format: uuid } }
        - { name: class_id, in: query, schema: { type: string, format: uuid } }
        - { name: attendance_risk, in: query, schema: { type: string, enum: [at_risk, on_track] } }
        - { name: sort_by, in: query, schema: { type: string, enum: [created_at, student_code, full_name], default: created_at } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200":
          description: Paginated students
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Create a student account and profile
      operationId: createAdminStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStudentRequest" }
      responses:
        "201":
          description: Student created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/students/{studentID}:
    parameters:
      - { $ref: "#/components/parameters/StudentID" }
    get:
      tags: [admin]
      summary: Get a student
      operationId: getAdminStudent
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      summary: Replace student account and profile fields
      operationId: updateAdminStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStudentRequest" }
      responses:
        "200":
          description: Student updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/students/{studentID}/status-history:
    parameters:
      - { $ref: "#/components/parameters/StudentID" }
    get:
      tags: [admin]
      summary: List immutable student lifecycle transitions
      operationId: listAdminStudentStatusHistory
      responses:
        "200":
          description: Newest-first status history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentStatusHistoryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/students/{studentID}/profile-summary:
    parameters:
      - { $ref: "#/components/parameters/StudentID" }
    get:
      tags: [admin]
      summary: Get the student's 360-degree core profile and operating metrics
      operationId: getAdminStudentProfileSummary
      responses:
        "200":
          description: Student profile summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfileSummaryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/students/{studentID}/class-history:
    parameters:
      - { $ref: "#/components/parameters/StudentID" }
    get:
      tags: [admin]
      summary: List all current and historical class enrollment periods for a student
      operationId: listAdminStudentClassHistory
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated student class history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentClassHistoryResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/students/{studentID}/attendance-breakdown:
    parameters:
      - { $ref: "#/components/parameters/StudentID" }
    get:
      tags: [admin]
      summary: Get student attendance breakdown and absence-risk status per class
      operationId: getAdminStudentAttendanceBreakdown
      responses:
        "200":
          description: List of class attendance breakdown items
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    class_id: { type: string }
                    class_code: { type: string }
                    class_name: { type: string }
                    course_name: { type: string }
                    minimum_attendance_pct: { type: number }
                    total_sessions: { type: integer }
                    attended_sessions: { type: integer }
                    absent_sessions: { type: integer }
                    attendance_pct: { type: number }
                    at_risk: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/students/{studentID}/academic-summary:
    parameters:
      - { $ref: "#/components/parameters/StudentID" }
    get:
      tags: [admin]
      summary: Get student academic test score summary
      operationId: getAdminStudentAcademicSummary
      responses:
        "200":
          description: List of academic test scores
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    test_id: { type: string }
                    test_title: { type: string }
                    pass_score: { type: number }
                    class_id: { type: string }
                    class_name: { type: string }
                    course_name: { type: string }
                    score: { type: number }
                    graded_at: { type: string }
                    passed: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/students/{studentID}/audit-logs:
    parameters:
      - { $ref: "#/components/parameters/StudentID" }
    get:
      tags: [admin]
      summary: List audit logs for student
      operationId: getAdminStudentAuditLogs
      responses:
        "200":
          description: Paginated audit log items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        actor_user_id: { type: string }
                        actor_email: { type: string }
                        action: { type: string }
                        entity_type: { type: string }
                        entity_id: { type: string }
                        old_values: { type: string }
                        new_values: { type: string }
                        reason: { type: string }
                        created_at: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/students/{studentID}/account-status:
    parameters:
      - { $ref: "#/components/parameters/StudentID" }
    patch:
      tags: [admin]
      summary: Lock/unlock or change student account status with mandatory reason
      operationId: updateAdminStudentAccountStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_status, reason]
              properties:
                account_status: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: Updated student profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/students/{studentID}/schedule:
    parameters:
      - { $ref: "#/components/parameters/StudentID" }
    get:
      tags: [admin]
      summary: List sessions within all effective enrollment periods for a student
      operationId: listAdminStudentSchedule
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Paginated student schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/students/export:
    get:
      tags: [admin]
      summary: Export the filtered student directory as UTF-8 CSV
      operationId: exportAdminStudents
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/StudentStatus" }
        - { name: course_id, in: query, schema: { type: string, format: uuid } }
        - { name: class_id, in: query, schema: { type: string, format: uuid } }
        - { name: attendance_risk, in: query, schema: { type: string, enum: [at_risk, on_track] } }
      responses:
        "200":
          description: Student CSV with a blank temporary_password template column
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/students/import:
    post:
      tags: [admin]
      summary: Import student profiles from UTF-8 CSV with row-level results
      operationId: importAdminStudents
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, maxLength: 2097152 }
      responses:
        "200":
          description: Import result; valid rows may succeed when other rows fail validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentImportResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/teachers:
    get:
      tags: [admin]
      summary: List teachers
      operationId: listAdminTeachers
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TeacherStatus" }
        - { name: course_id, in: query, schema: { type: string, format: uuid } }
        - { name: class_id, in: query, schema: { type: string, format: uuid } }
        - { name: assignment, in: query, schema: { type: string, enum: [assigned, unassigned] } }
        - { name: sort_by, in: query, schema: { type: string, enum: [created_at, teacher_code, full_name], default: created_at } }
        - { name: sort_order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200":
          description: Paginated teachers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Create a teacher account and profile
      operationId: createAdminTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeacherRequest" }
      responses:
        "201":
          description: Teacher created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/teachers/{teacherID}:
    parameters:
      - { $ref: "#/components/parameters/TeacherID" }
    get:
      tags: [admin]
      summary: Get a teacher
      operationId: getAdminTeacher
      responses:
        "200":
          description: Teacher
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      summary: Replace teacher account and profile fields
      operationId: updateAdminTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTeacherRequest" }
      responses:
        "200":
          description: Teacher updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/admin/teachers/{teacherID}/profile-summary:
    parameters:
      - { $ref: "#/components/parameters/TeacherID" }
    get:
      tags: [admin]
      summary: Get the teacher's 360-degree core profile and operating metrics
      operationId: getAdminTeacherProfileSummary
      responses:
        "200":
          description: Teacher profile summary
          content:
