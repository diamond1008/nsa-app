components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token (Phase 3). Refresh token is an HttpOnly cookie.

  parameters:
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 200 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    StudentID:
      name: studentID
      in: path
      required: true
      schema: { type: string, format: uuid }
    TeacherID:
      name: teacherID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CourseID:
      name: courseID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModuleID:
      name: moduleID
      in: path
      required: true
      schema: { type: string, format: uuid }
    CriterionID:
      name: criterionID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClassID:
      name: classID
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnrollmentID:
      name: enrollmentID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentID:
      name: assignmentID
      in: path
      required: true
      schema: { type: string, format: uuid }
    LocationID:
      name: locationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionID:
      name: sessionID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttendanceID:
      name: attendanceID
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssessmentID:
      name: assessmentID
      in: path
      required: true
      schema: { type: string, format: uuid }
    FromTime:
      name: from
      in: query
      description: Inclusive RFC3339 window start; omitted means unbounded.
      schema: { type: string, format: date-time }
    ToTime:
      name: to
      in: query
      description: Exclusive RFC3339 window end; omitted means unbounded.
      schema: { type: string, format: date-time }

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Required role, assignment, or ownership check failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Referenced resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Unique, capacity, state, or relationship conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnprocessableEntity:
      description: Referenced student is not actively enrolled in the session class
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@nsa.local }
        password: { type: string, format: password, example: NsaDemo@123 }

    SSOLoginRequest:
      type: object
      required: [provider, email]
      properties:
        provider: { type: string, enum: [google, microsoft], example: google }
        email: { type: string, format: email, example: admin@nsa.local }

    OAuthCallbackRequest:
      type: object
      required: [provider, code]
      properties:
        provider: { type: string, enum: [google, microsoft], example: google }
        code: { type: string, example: 4/0AfgeXvu... }
        redirect_uri: { type: string, example: http://localhost:5173/auth/callback }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 8 }

    ProfileRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: STU-DEMO-001 }
        full_name: { type: string, example: Demo Student }

    UserInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, example: admin@nsa.local }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, TEACHER, STUDENT, SALE, SALE_ADMIN] }
          example: [ADMIN]
        must_change_password: { type: boolean, example: false }
        student_profile: { $ref: "#/components/schemas/ProfileRef" }
        teacher_profile: { $ref: "#/components/schemas/ProfileRef" }

    TokenBundleResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          properties:
            access_token: { type: string }
            token_type: { type: string, example: Bearer }
            access_expires_at: { type: string, format: date-time }
            must_change_password: { type: boolean }
            user: { $ref: "#/components/schemas/UserInfo" }
        message: { type: string, example: Success }

    MessageResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          properties:
            message: { type: string, example: "Logged out" }
        message: { type: string, example: Success }

    HealthResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          additionalProperties: true
        message:
          type: string
          example: Success

    UserStatus:
      type: string
      enum: [pending, active, suspended, inactive]
    StudentStatus:
      type: string
      enum: [pending, active, suspended, completed, withdrawn]
    TeacherStatus:
      type: string
      enum: [active, inactive]
    CourseStatus:
      type: string
      enum: [draft, active, inactive, archived]
    ClassStatus:
      type: string
      enum: [planning, open, in_progress, completed, cancelled, archived]
    EnrollmentStatus:
      type: string
      enum: [enrolled, transferred, completed, withdrawn]

    PaginationMeta:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }

    CreateStudentRequest:
      type: object
      required: [email, temporary_password, account_status, full_name, status]
      properties:
        email: { type: string, format: email }
        temporary_password: { type: string, format: password, minLength: 8 }
        account_status: { $ref: "#/components/schemas/UserStatus" }
        full_name: { type: string, maxLength: 160 }
        avatar_url:
          type: [string, "null"]
          pattern: '^data:image/webp;base64,'
          maxLength: 349550
          description: Optional WebP data URL; decoded image data must not exceed 256 KiB
        phone: { type: [string, "null"], maxLength: 30 }
        date_of_birth: { type: [string, "null"], format: date }
