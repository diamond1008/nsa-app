            items: { type: array, items: { $ref: "#/components/schemas/CompletionCandidate" } }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
        message: { type: string }
    CompletionDecisionRequest:
      type: object
      additionalProperties: false
      required: [status, note]
      properties:
        status: { type: string, enum: [approved, rejected] }
        note: { type: string, minLength: 1, maxLength: 1000 }
    Certificate:
      type: object
      required: [id, completion_id, certificate_number, verification_code, class_code, class_name, course_code, course_name, student_code, student_name, issued_at, is_current]
      properties:
        id: { type: string, format: uuid }
        completion_id: { type: string, format: uuid }
        certificate_number: { type: string, pattern: '^CC[0-9]{8}$' }
        verification_code: { type: string, format: uuid }
        class_code: { type: string }
        class_name: { type: string }
        course_code: { type: string }
        course_name: { type: string }
        student_code: { type: string }
        student_name: { type: string }
        issued_at: { type: string, format: date-time }
        is_current: { type: boolean }
        revoked_at: { type: [string, "null"], format: date-time }
        revoke_reason: { type: [string, "null"] }
    CertificateActionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    CompletionDecisionResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          required: [candidate]
          properties:
            candidate: { $ref: "#/components/schemas/CompletionCandidate" }
            certificate: { oneOf: [{ $ref: "#/components/schemas/Certificate" }, { type: "null" }] }
        message: { type: string }
    CertificateResponse:
      type: object
      required: [data, message]
      properties:
        data: { $ref: "#/components/schemas/Certificate" }
        message: { type: string }
    CertificateListResponse:
      type: object
      required: [data, message]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Certificate" } }
        message: { type: string }
    ReportSummaryResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          required: [active_students, open_classes, upcoming_sessions, at_risk_students, approved_completions, pending_notifications]
          properties:
            active_students: { type: integer }
            open_classes: { type: integer }
            upcoming_sessions: { type: integer }
            at_risk_students: { type: integer }
            approved_completions: { type: integer }
            pending_notifications: { type: integer }
        message: { type: string }
    Notification:
      type: object
      required: [id, title, message, type, status, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        message: { type: string }
        type: { type: string }
        status: { type: string, enum: [unread, read, archived] }
        action_url: { type: [string, "null"] }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    NotificationListResponse:
      type: object
      required: [data, message]
      properties:
        data:
          type: object
          required: [items, meta, unread]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
            unread: { type: integer }
        message: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: STUDENT_NOT_FOUND
            message:
              type: string
              example: Student not found
            details:
              type: array
              items:
                type: object
                additionalProperties: true
              default: []

    # Sale CRM Schemas (Phase 26)
    LeadSource:
      type: string
      enum: [facebook, tiktok, google, zalo, website, referral, walk_in, event, other]

    LeadPipelineStatus:
      type: string
      enum: [data_moi, knm_thue_bao, goi_lai_sau, follow, tu_choi, da_dang_ky, dang_hoc, ket_thuc]

    InteractionChannel:
      type: string
      enum: [phone_call, zalo, facebook, email, in_person, sms, other]

    OrderStatus:
      type: string
      enum: [pending, paid, cancelled, refunded]

    CreateLeadRequest:
      type: object
      required: [full_name]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, maxLength: 20 }
        email: { type: string, format: email }
        date_of_birth: { type: string, format: date }
        gender: { type: string, enum: [male, female, other] }
        address: { type: string }
        source: { $ref: "#/components/schemas/LeadSource" }
        source_detail: { type: string }
        utm_source: { type: string }
        utm_medium: { type: string }
        utm_campaign: { type: string }
        utm_content: { type: string }
        utm_term: { type: string }
        interested_course_id: { type: string, format: uuid }
        notes: { type: string }
        assigned_to: { type: string, format: uuid }

    ConvertLeadRequest:
      type: object
      required: [class_id, amount]
      properties:
        class_id: { type: string, format: uuid }
        amount: { type: number, minimum: 0 }
        discount_amount: { type: number, minimum: 0, default: 0 }
        discount_note: { type: string }
        payment_method: { type: string }
        notes: { type: string }

    ConvertLeadResponse:
      type: object
      required: [student_id, student_code, order_id, order_code]
      properties:
        student_id: { type: string, format: uuid }
        student_code: { type: string }
        order_id: { type: string, format: uuid }
        order_code: { type: string }
        initial_password: { type: string }

    CreateLeadInteractionRequest:
      type: object
      required: [channel, summary]
      properties:
        channel: { $ref: "#/components/schemas/InteractionChannel" }
        summary: { type: string, minLength: 1 }
        outcome: { type: string }

    CreateLeadTaskRequest:
      type: object
      required: [title, due_at]
      properties:
        assigned_to: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string }
        due_at: { type: string, format: date-time }

    CreateOrderRequest:
      type: object
      required: [amount]
      properties:
        lead_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        course_id: { type: string, format: uuid }
        class_id: { type: string, format: uuid }
        amount: { type: number, minimum: 0 }
        discount_amount: { type: number, minimum: 0, default: 0 }
        discount_note: { type: string }
        payment_method: { type: string }
        notes: { type: string }

# Default security for all business endpoints; system endpoints opt out above.
security:
  - bearerAuth: []
