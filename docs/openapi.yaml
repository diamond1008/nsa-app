    post:
      tags: [teacher]
      summary: Save or update a batch of attendance during the session day
      description: |
        The authenticated teacher must be assigned to the session's class.
        The entire batch is transactional. Every student must have an active
        enrollment and student IDs must be unique inside the request. Existing
        records are updated. At 00:00 Asia/Ho_Chi_Minh on the next day, missing
        records are saved as Absent and the session is automatically locked.
      operationId: recordTeacherSessionAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceBatchRequest" }
      responses:
