name: CD — Deploy to Production VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu 24.04 VPS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    steps:
      - name: Check required SSH secrets
        id: check_secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [[ -z "$VPS_HOST" || -z "$VPS_SSH_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping CD deployment because VPS_HOST / VPS_SSH_KEY secrets are not configured yet."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '24700' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/nsa-app' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" bash -s <<EOF
            set -euo pipefail
            cd "${VPS_APP_DIR}"
            if docker compose --env-file .env.production -f compose.production.yaml ps --status running | grep -q postgres; then
              ./scripts/backup-db.sh || true
            fi
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/*.sh
            docker compose --env-file .env.production -f compose.production.yaml build --pull
            docker compose --env-file .env.production -f compose.production.yaml up -d --remove-orphans
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1/ready >/dev/null 2>&1; then
                echo "Health & Readiness verified!"
                break
              fi
              sleep 2
            done
            docker image prune -f
          EOF
