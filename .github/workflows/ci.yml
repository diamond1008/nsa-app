name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Check Go formatting
        run: |
          unformatted="$(find apps/api database/generated -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: Vet, test, and build API
        working-directory: apps/api
        run: |
          go vet ./...
          go test -race ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/nsa-api ./cmd/api

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Reject high or critical advisories
        run: npm audit --audit-level=high --omit=dev

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nsa
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nsa_training_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nsa -d nsa_training_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://nsa:ci-only-password@127.0.0.1:5432/nsa_training_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.27.0
      - name: Validate up/down/up migration cycle
        run: |
          goose -dir database/migrations postgres "$DATABASE_URL" up
          goose -dir database/migrations postgres "$DATABASE_URL" status
          goose -dir database/migrations postgres "$DATABASE_URL" down-to 0
          goose -dir database/migrations postgres "$DATABASE_URL" up

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [api, web, migrations]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nsa
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nsa_training_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nsa -d nsa_training_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://nsa:ci-only-password@127.0.0.1:5432/nsa_training_e2e?sslmode=disable
      JWT_ACCESS_SECRET: ci-e2e-secret-that-is-at-least-32-characters
      APP_ENV: development
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
      E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install database and browser tooling
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.27.0
          cd apps/web
          npm ci
          npx playwright install --with-deps chromium
      - name: Prepare deterministic E2E database
        run: |
          goose -dir database/migrations postgres "$DATABASE_URL" up
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seeds/dev.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seeds/e2e.sql
      - name: Start API
        run: |
          cd apps/api
          nohup go run ./cmd/api > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8080/ready && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Run Playwright critical paths
        working-directory: apps/web
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/api.log
          if-no-files-found: ignore
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [api, web, migrations, e2e]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build production images
        run: |
          docker build -f apps/api/Dockerfile -t nsa-api:ci .
          docker build -f apps/web/Dockerfile -t nsa-web:ci .
          docker build -f database/Dockerfile -t nsa-migrate:ci .
